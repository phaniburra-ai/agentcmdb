<!doctype html>
<html>
<head>
  <title>AgentCMDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>AgentCMDB</h1>
      <p>System of record and control plane for enterprise AI agents</p>
    </div>
    <button onclick="loadAgents()">Refresh</button>
  </header>

  <main>
    <section class="panel">
      <h2>Register Agent</h2>
      <div class="grid">
        <input id="name" placeholder="Agent name" />
        <input id="owner" placeholder="Owner / team" />
        <input id="business_unit" placeholder="Business unit" />
        <select id="environment"><option>dev</option><option>test</option><option>prod</option></select>
        <input id="framework" placeholder="Framework e.g., LangGraph" />
        <input id="model_provider" placeholder="Model provider" />
        <input id="model_name" placeholder="Model name" />
        <select id="risk_level"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select>
      </div>
      <textarea id="description" placeholder="Purpose / description"></textarea>
      <button onclick="createAgent()">Create Agent</button>
      <p class="hint">Uses default dev API key. Change the key in production.</p>
    </section>

    <section class="panel">
      <h2>Agent Inventory</h2>
      <input id="search" placeholder="Search agents" oninput="loadAgents()" />
      <table>
        <thead><tr><th>Name</th><th>Owner</th><th>Env</th><th>Risk</th><th>State</th><th>Model</th></tr></thead>
        <tbody id="agents"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Cost Summary</h2>
      <table>
        <thead><tr><th>Agent</th><th>Input Tokens</th><th>Output Tokens</th><th>Cost USD</th><th>Events</th></tr></thead>
        <tbody id="costs"></tbody>
      </table>
    </section>
  </main>

<script src="/static/app.js"></script>
</body>
</html>
